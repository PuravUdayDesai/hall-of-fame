<title>Purav Desai Hall of Fame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Josefin+Sans:wght@400;600&family=Marcellus&display=swap">
<style>
/* Layout: a white gallery cabinet. Fluted pilasters frame a grid of compartments,
   a meander band crowns it, and each row rests on a gold-edged shelf with a small engraved label.
   Opening a compartment shows a framed detail card with four doors: Demo, GitHub, Event, Summary.
   Single light theme by design: the brief asks for a white ground. */
:root {
  --bg: #FFFFFF;
  --ink: #15171C;
  --muted: #6A6D74;
  --gold: #A07D2C;
  --gold-soft: #D6C08A;
  --line: #E6E4DF;
  --stone: #F7F6F2;
  --stone-2: #E9E7E1;
  --hover: #FCFBF8;

  --display: "Marcellus", "Trajan Pro", "Optima", Georgia, serif;
  --body: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --label: "Josefin Sans", "Futura", "Avenir Next", system-ui, sans-serif;
  color-scheme: light;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); }
* { box-sizing: border-box; }
p, h1, h2, h3, dl, dd, ul { margin: 0; }
ul { padding: 0; list-style: none; }
button { font: inherit; color: inherit; }
a { color: inherit; }

.hall {
  height: 100%;
  max-width: 1360px;
  margin: 0 auto;
  padding-inline: clamp(16px, 3.5vw, 56px);
  padding-block: clamp(12px, 2.6vh, 32px);
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  gap: clamp(10px, 2.2vh, 26px);
}

/* Header */
.masthead { display: grid; justify-items: center; gap: clamp(4px, .8vh, 9px); text-align: center; }
.eyebrow, .prize, .date, .shelf-label, .stat-label, .more, .tab-label, .btn, .host, dt, .wall-title {
  font-family: var(--label); text-transform: uppercase;
}
.masthead .eyebrow { font-size: clamp(9px, 1.2vh, 11px); letter-spacing: .44em; padding-left: .44em; color: var(--gold); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(26px, 4.8vh, 46px); letter-spacing: .14em; padding-left: .14em; line-height: 1; }
.rule { display: flex; align-items: center; gap: 12px; width: min(260px, 60%); color: var(--gold-soft); }
.rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: currentColor; }
.rule svg { width: 7px; height: 7px; fill: var(--gold); }

/* Cabinet */
.cabinet { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 0; }
.pilaster { width: clamp(12px, 1.1vw, 16px); display: flex; flex-direction: column; }
.pilaster .shaft { flex: 1; background: repeating-linear-gradient(90deg, var(--stone) 0 3px, var(--stone-2) 3px 4px); border-inline: 1px solid var(--line); }
.pilaster .capital, .pilaster .base { height: 8px; margin-inline: -4px; background: var(--stone-2); }
.pilaster .capital { border-top: 1px solid var(--gold-soft); }

.case { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; border-block: 1px solid var(--line); }
.frieze { display: block; width: 100%; height: 15px; color: var(--gold-soft); border-bottom: 1px solid var(--line); }

.grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  grid-template-rows: minmax(0, 2.1fr) auto minmax(0, 1fr) auto;
  column-gap: 1px;
  background: var(--line);
  min-height: 0;
}
.cell { background: var(--bg); min-width: 0; min-height: 0; padding: clamp(10px, 1.7vh, 20px) clamp(12px, 1.4vw, 22px) clamp(10px, 1.5vh, 16px); }

.ledge {
  grid-column: 1 / -1; position: relative;
  height: clamp(9px, 1.4vh, 13px);
  background: linear-gradient(var(--stone), var(--stone-2));
  border-top: 1px solid var(--gold-soft);
  box-shadow: 0 6px 8px -7px rgba(21, 23, 28, .22);
}
.shelf-label {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--bg); border: 1px solid var(--gold-soft);
  padding: 3px 12px 2px; white-space: nowrap;
  font-size: clamp(8px, 1.1vh, 9.5px); letter-spacing: .3em; color: var(--gold);
}

/* Upright compartment (top shelf) */
.award { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(3px, .65vh, 7px); transition: background .3s; }
.award:hover { background: var(--hover); }
.award-top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.date { font-size: clamp(8.5px, 1.1vh, 10px); letter-spacing: .2em; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.medal {
  width: clamp(22px, 3.1vh, 28px); height: clamp(22px, 3.1vh, 28px); border-radius: 50%;
  border: 1px solid var(--gold-soft); display: grid; place-items: center;
  font-family: var(--display); font-size: clamp(10px, 1.4vh, 12px); color: var(--gold); line-height: 1;
}
.object { display: grid; justify-items: center; margin-block: 0 clamp(2px, .7vh, 7px); }
.icon {
  width: clamp(42px, 8vh, 80px); height: clamp(42px, 8vh, 80px);
  color: var(--gold); fill: none; stroke: currentColor; stroke-width: 1.3;
  stroke-linecap: round; stroke-linejoin: round;
  transition: transform .5s cubic-bezier(.2, .7, .2, 1);
}
.award:hover .icon { transform: translateY(-3px); }
.plinth { width: clamp(44px, 6.6vh, 70px); height: 4px; margin-top: 4px; border-top: 1px solid var(--gold-soft); border-bottom: 1px solid var(--line); }
h2 { font-family: var(--display); font-weight: 400; font-size: clamp(17px, 2.4vh, 23px); line-height: 1.12; letter-spacing: .02em; text-wrap: balance; }
.prize { font-size: clamp(8.5px, 1.15vh, 10.5px); letter-spacing: .2em; padding-left: .2em; font-weight: 600; color: var(--gold); }
.sponsor-line {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 9px;
  font-style: italic; font-size: clamp(13.5px, 1.8vh, 16px); color: var(--ink);
}
.sponsor-line .logo { color: var(--ink); }
.event { font-size: clamp(13px, 1.75vh, 15.5px); line-height: 1.28; color: var(--muted); text-wrap: balance; max-width: 30ch; }
.more {
  margin-top: auto; padding: 4px 2px 0; border: 0; background: none; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
  font-size: clamp(8.5px, 1.1vh, 9.5px); letter-spacing: .24em; color: var(--muted);
  transition: color .3s;
}
.more::after { content: ""; position: absolute; inset: 0; }
.more svg { width: 14px; height: 8px; fill: none; stroke: currentColor; stroke-width: 1.2; transition: transform .3s; }
.award:hover .more, .more:focus-visible { color: var(--gold); }
.award:hover .more svg { transform: translateX(3px); }
.more:focus-visible { outline: none; }
.award:has(.more:focus-visible) { outline: 1px solid var(--gold); outline-offset: -6px; }

/* Wide compartment (lower shelf) */
.wide { grid-column: span 2; display: flex; align-items: center; gap: clamp(16px, 2.4vw, 36px); }
.wide .object { margin: 0; flex: none; }
.wide .icon { width: clamp(54px, 10vh, 100px); height: clamp(54px, 10vh, 100px); }
.wide .text { display: grid; gap: clamp(3px, .6vh, 6px); min-width: 0; }
.wide .eyebrow { font-size: clamp(8.5px, 1.1vh, 10px); letter-spacing: .26em; color: var(--muted); }
.wide h2 { font-size: clamp(19px, 2.8vh, 27px); }
.detail { font-style: italic; font-size: clamp(14px, 1.9vh, 17px); line-height: 1.2; }

/* Record tablet */
.record { grid-column: span 2; display: grid; align-content: center; gap: clamp(8px, 1.3vh, 14px); }
.record .eyebrow { font-size: clamp(8.5px, 1.1vh, 10px); letter-spacing: .26em; color: var(--muted); text-align: center; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { display: grid; justify-items: center; gap: 4px; text-align: center; padding-inline: 6px; }
.stat + .stat { border-left: 1px solid var(--line); }
.stat-value { font-family: var(--display); font-size: clamp(22px, 3.6vh, 34px); line-height: 1; font-variant-numeric: lining-nums tabular-nums; }
.stat-label { font-size: clamp(8px, 1.05vh, 9.5px); letter-spacing: .18em; color: var(--muted); line-height: 1.4; }

/* Logos: every sponsor mark is a single-colour mask painted with the text colour */
.logo {
  display: inline-block; flex: none; max-width: 100%; vertical-align: middle;
  background-color: currentColor;
  -webkit-mask: var(--src) center / contain no-repeat;
  mask: var(--src) center / contain no-repeat;
}

/* Detail card */
.detail-card {
  width: min(1020px, calc(100% - 32px));
  max-height: calc(100% - 32px);
  padding: 0; border: 1px solid var(--gold-soft);
  background: var(--bg); color: var(--ink);
  box-shadow: 0 40px 90px -40px rgba(21, 23, 28, .45);
  overflow: auto;
}
.detail-card::backdrop { background: rgba(247, 246, 242, .78); backdrop-filter: blur(3px); }
.detail-card[open] { animation: rise .45s cubic-bezier(.2, .7, .2, 1); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.d-frame { position: relative; display: grid; }
.d-frame::before { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); pointer-events: none; }

.d-head {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
  gap: clamp(16px, 2.4vw, 32px);
  padding: clamp(16px, 2.6vh, 28px) clamp(20px, 3vw, 40px) clamp(14px, 2.2vh, 24px);
}
.d-head .icon { width: clamp(60px, 9vh, 84px); height: clamp(60px, 9vh, 84px); }
.d-titles { display: grid; gap: 6px; min-width: 0; }
.d-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.d-kicker .prize { padding-left: 0; }
.d-kicker .date::before { content: ""; display: inline-block; width: 4px; height: 4px; margin-right: 14px; transform: translateY(-2px) rotate(45deg); background: var(--gold-soft); }
.d-head h2 { font-size: clamp(26px, 4vh, 38px); letter-spacing: .04em; }
.d-pitch { font-size: clamp(16px, 2.1vh, 19px); color: var(--muted); font-style: italic; line-height: 1.3; }
.close {
  align-self: start; width: 38px; height: 38px; border: 1px solid var(--line); background: var(--bg);
  display: grid; place-items: center; cursor: pointer; transition: border-color .3s;
}
.close svg { width: 14px; height: 14px; stroke: var(--ink); stroke-width: 1.2; }
.close:hover, .close:focus-visible { border-color: var(--gold); outline: none; }

.tabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border-block: 1px solid var(--line); }
.tab {
  display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; column-gap: 12px; row-gap: 2px;
  padding: clamp(12px, 1.8vh, 18px) clamp(14px, 1.8vw, 22px);
  border: 0; background: var(--bg); cursor: pointer; text-align: left;
  transition: background .3s, box-shadow .3s;
}
.tab svg { grid-row: span 2; width: 26px; height: 26px; fill: none; stroke: var(--gold); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.tab-label { font-size: 10.5px; letter-spacing: .24em; font-weight: 600; }
.tab-sub { font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tab:hover { background: var(--hover); }
.tab[aria-selected="true"] { background: var(--stone); box-shadow: inset 0 -2px 0 var(--gold); }
.tab:focus-visible { outline: 1px solid var(--gold); outline-offset: -5px; }
.tab.is-empty .tab-sub { font-style: italic; }

.panel { padding: clamp(18px, 3vh, 32px) clamp(20px, 3vw, 40px) clamp(20px, 3.2vh, 34px); min-height: clamp(240px, 34vh, 330px); }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 24px; margin-bottom: clamp(14px, 2.2vh, 22px); }
.panel-head .eyebrow { font-size: 10px; letter-spacing: .3em; color: var(--gold); }
.panel h3 { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 2.8vh, 26px); letter-spacing: .03em; line-height: 1.15; margin-top: 6px; }

.btn {
  display: inline-flex; align-items: center; gap: 10px; white-space: nowrap;
  padding: 11px 16px 10px; border: 1px solid var(--gold); background: var(--bg);
  font-size: 10px; letter-spacing: .22em; font-weight: 600; text-decoration: none; color: var(--ink);
  transition: background .3s, color .3s; cursor: pointer;
}
.btn svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.btn:hover, .btn:focus-visible { background: var(--gold); color: var(--bg); outline: none; }

/* Summary */
.summary { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: clamp(20px, 3.4vw, 48px); }
.lead { font-size: clamp(18px, 2.4vh, 21px); line-height: 1.45; max-width: 56ch; margin-top: 10px; }
.outcome { margin-top: 16px; display: flex; gap: 12px; align-items: baseline; font-size: 17px; font-style: italic; }
.outcome::before { content: ""; flex: none; width: 6px; height: 6px; transform: rotate(45deg) translateY(-2px); background: var(--gold); }
.facts { display: grid; border-top: 1px solid var(--line); }
.facts div { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; padding-block: 9px; border-bottom: 1px solid var(--line); align-items: baseline; }
dt { font-size: 9.5px; letter-spacing: .2em; color: var(--muted); }
dd { font-size: 17px; line-height: 1.3; }

/* Demo */
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 14px; }
.card {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 16px;
  padding: 18px 20px; border: 1px solid var(--line); text-decoration: none;
  transition: border-color .3s, background .3s;
}
.card > svg:first-child { width: 34px; height: 34px; fill: none; stroke: var(--gold); stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.card-title { font-family: var(--display); font-size: 19px; display: block; }
.card-host { font-family: var(--label); font-size: 10px; letter-spacing: .08em; color: var(--muted); display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .arrow { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.3; transition: stroke .3s, transform .3s; }
.card:hover, .card:focus-visible { border-color: var(--gold-soft); background: var(--hover); outline: none; }
.card:hover .arrow { stroke: var(--gold); transform: translate(2px, -2px); }
.empty { font-size: 18px; font-style: italic; color: var(--muted); max-width: 52ch; line-height: 1.45; }
.empty + .btn { margin-top: 16px; }

/* GitHub */
.repo-path { font-family: var(--display); font-size: clamp(19px, 2.6vh, 24px); letter-spacing: .02em; overflow-wrap: anywhere; }
.repo-path span { color: var(--muted); }
.langbar { display: flex; height: 6px; margin-top: 18px; gap: 2px; }
.langbar i { display: block; height: 100%; }
.langs { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 12px; font-family: var(--label); font-size: 10.5px; letter-spacing: .12em; color: var(--muted); font-variant-numeric: tabular-nums; }
.langs li { display: flex; align-items: center; gap: 8px; }
.langs b { font-weight: 600; color: var(--ink); }
.langs i { width: 8px; height: 8px; transform: rotate(45deg); }
.repo-note { margin-top: 18px; font-size: 18px; line-height: 1.45; max-width: 60ch; }

/* Event */
.event-meta { font-size: 17px; color: var(--muted); margin-top: 6px; }
.wall-group + .wall-group { margin-top: 16px; }
.wall-title { font-size: 9.5px; letter-spacing: .26em; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 12px; }
.wall-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.wall li { background: var(--bg); height: 54px; display: grid; place-items: center; padding: 8px 12px; position: relative; color: #5C5F66; }
.wall li.is-prize { color: var(--gold); background: var(--stone); }
.wall li.is-prize::after { content: ""; position: absolute; top: 6px; right: 6px; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); }
.wall-key { margin-top: 10px; font-size: 14px; font-style: italic; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.wall-key::before { content: ""; width: 5px; height: 5px; transform: rotate(45deg); background: var(--gold); }

/* Short desktop screens: allow scroll instead of crushing compartments */
@media (max-height: 640px) and (min-width: 961px) {
  .hall { height: auto; }
  .grid { grid-template-rows: auto auto auto auto; }
}
/* Tablet and phone */
@media (max-width: 960px) {
  .hall { height: auto; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
  .icon { width: 68px; height: 68px; }
  .wide .icon { width: 84px; height: 84px; }
  .cell { padding: 20px 18px; }
  .summary { grid-template-columns: minmax(0, 1fr); }
  .tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .wide, .record { grid-column: auto; }
  .wide { flex-direction: column; text-align: center; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 14px; }
  .stat:nth-child(3) { border-left: 0; }
  .pilaster { display: none; }
  .d-head { grid-template-columns: minmax(0, 1fr) auto; }
  .d-head .object { display: none; }
  .tab svg { width: 22px; height: 22px; }
  .facts div { grid-template-columns: 84px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

<main class="hall">
  <header class="masthead">
    <p class="eyebrow">Hall of Fame</p>
    <h1>Purav Desai</h1>
    <div class="rule" aria-hidden="true"><svg viewBox="0 0 10 10"><path d="M5 0 L10 5 L5 10 L0 5 Z"/></svg></div>
  </header>

  <div class="cabinet">
    <div class="pilaster" aria-hidden="true"><div class="capital"></div><div class="shaft"></div><div class="base"></div></div>
    <div class="case">
      <svg class="frieze" aria-hidden="true">
        <defs>
          <pattern id="meander" width="14" height="15" patternUnits="userSpaceOnUse">
            <path d="M0 1.5 H14 M0 13.5 H14 M2 13.5 V4 H11 V11 H5.5 V7.5 H8" fill="none" stroke="currentColor" stroke-width="1"/>
          </pattern>
        </defs>
        <rect width="100%" height="15" fill="url(#meander)"/>
      </svg>
      <section class="grid" id="grid" aria-label="Achievements"></section>
    </div>
    <div class="pilaster" aria-hidden="true"><div class="capital"></div><div class="shaft"></div><div class="base"></div></div>
  </div>
</main>

<dialog class="detail-card" id="detail" aria-labelledby="d-title">
  <div class="d-frame">
    <svg class="frieze" aria-hidden="true"><rect width="100%" height="15" fill="url(#meander)"/></svg>
    <header class="d-head">
      <div class="object" id="d-object"></div>
      <div class="d-titles">
        <div class="d-kicker"><p class="prize" id="d-prize"></p><p class="date" id="d-date"></p></div>
        <h2 id="d-title"></h2>
        <p class="d-pitch" id="d-pitch"></p>
      </div>
      <button class="close" id="d-close" aria-label="Close details">
        <svg viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1 L13 13 M13 1 L1 13"/></svg>
      </button>
    </header>
    <nav class="tabs" role="tablist" aria-label="Project details" id="d-tabs"></nav>
    <section class="panel" role="tabpanel" id="d-panel" tabindex="-1"></section>
  </div>
</dialog>

const HONORS = [

const ICONS = {
  lyre: () => `

    <path d="M42 52 C51 44 53 31 47 22 C44 17 46 11 51 10"/>
    <circle cx="12" cy="9.5" r="1.4"/><circle cx="52" cy="9.5" r="1.4"/>

    <path d="M19 52 Q32 59.5 45 52 Z"/>
    <path d="M26.5 21 V54.2 M30.5 21 V55.2 M34.5 21 V55.2 M38.5 21 V54.2" stroke-width="1"/>`,
  hourglass: () => `
    <path d="M15 7.5 H49 M17 10 H47 M15 56.5 H49 M17 54 H47"/>
    <path d="M20 10 V54 M44 10 V54" stroke-width="1"/>
    <path d="M24 12 C24 24 31 28 31 32 C31 36 24 40 24 52 H40 C40 40 33 36 33 32 C33 28 40 24 40 12 Z"/>

  scales: () => `
    <circle cx="32" cy="8.5" r="2.2"/>
    <path d="M32 10.7 V52"/>
    <path d="M12 17 Q32 13.5 52 17"/>
    <path d="M12.5 17 L6.5 35 M12.5 17 L18.5 35 M51.5 17 L45.5 35 M51.5 17 L57.5 35" stroke-width="1"/>

    <path d="M44 35 H59 Q51.5 43.5 44 35 Z"/>
    <path d="M27 52 H37 M23 56 H41"/>`,
  asclepius: () => `
    <path d="M32 6 V58"/><path d="M29.5 6 H34.5 M29.5 58 H34.5"/>
    <path d="M30 52 C21 49 22 43 32 41 C42 39 42 33 32 31 C22 29 22 23 32 21 C38 20 40.5 16.5 37.5 13.2"/>
    <path d="M37.5 13.2 C36.3 10.4 40 8.8 41.4 10.8 C42.6 12.6 39.6 14.4 37.5 13.2 Z" fill="currentColor"/>`,
  laurel: () => {
    const P = [[30, 57], [13, 52], [7, 30], [19, 10]];
    const pt = t => [0, 1].map(i => (1-t)**3*P[0][i] + 3*(1-t)**2*t*P[1][i] + 3*(1-t)*t*t*P[2][i] + t**3*P[3][i]);
    const tan = t => [0, 1].map(i => 3*(1-t)**2*(P[1][i]-P[0][i]) + 6*(1-t)*t*(P[2][i]-P[1][i]) + 3*t*t*(P[3][i]-P[2][i]));
    const leaf = (x, y, a) => `<path d="M0 0 C2.4 -2.3 6.4 -2.3 8.6 0 C6.4 2.3 2.4 2.3 0 0 Z" transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${a.toFixed(1)})"/>`;
    let side = `<path d="M${P[0]} C${P[1]} ${P[2]} ${P[3]}"/>`;
    for (let k = 0; k < 7; k++) {
      const t = .12 + k * .125, [x, y] = pt(t), [dx, dy] = tan(t);
      const a = Math.atan2(dy, dx) * 180 / Math.PI;
      side += leaf(x, y, a - 40) + leaf(x, y, a + 40);
    }
    const [ex, ey] = tan(1);
    side += leaf(19, 10, Math.atan2(ey, ex) * 180 / Math.PI);
    return `
      <g stroke-width="1">${side}</g>
      <g stroke-width="1" transform="translate(64 0) scale(-1 1)">${side}</g>
      <path d="M27 56.5 Q32 52.5 37 56.5 M30 56.5 L26.5 61 M34 56.5 L37.5 61" stroke-width="1"/>
      <path d="M32 17 C36.5 21 36.5 26 32 29 C27.5 26 27.5 21 32 17 Z"/>
      <path d="M32 22 C33.6 24 33.6 26 32 27.2 C30.4 26 30.4 24 32 22 Z" fill="currentColor" stroke="none"/>
      <path d="M26.5 30 H37.5 L34.5 34 H29.5 Z"/>
      <path d="M30.5 34 L31.4 46 H32.6 L33.5 34"/>`;
  },
  seal: () => `
    <circle cx="32" cy="27" r="15"/><circle cx="32" cy="27" r="10" stroke-width="1"/>
    <path d="M32 21 L33.6 25.4 L38 27 L33.6 28.6 L32 33 L30.4 28.6 L26 27 L30.4 25.4 Z" fill="currentColor" stroke="none"/>

    <path d="M39.5 40 L44 56 L38 52.5 L35 57.5 L33 42"/>`,
};

/* Small line glyphs for the detail card (24-unit grid, gold hairline) */
const GLYPHS = {
  demo: `<circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="12" r="7" stroke-width=".8" stroke-dasharray="1 1.6"/><path d="M10 8.6 L15.4 12 L10 15.4 Z"/>`,
  github: `<path d="M8.6 7.5 L4 12 L8.6 16.5 M15.4 7.5 L20 12 L15.4 16.5 M13.4 5.5 L10.6 18.5"/>`,
  event: `<rect x="3.5" y="5.5" width="17" height="15"/><path d="M3.5 10 H20.5 M8 3.5 V7.5 M16 3.5 V7.5"/><path d="M12 12.6 L14 15 L12 17.4 L10 15 Z"/>`,

  app: `<rect x="2.5" y="4" width="19" height="16"/><path d="M2.5 8 H21.5"/><circle cx="5" cy="6" r=".5"/><circle cx="7" cy="6" r=".5"/><path d="M6 12 H13 M6 15 H11"/><path d="M15.5 11 H18.5 V16.5 H15.5 Z"/>`,

const glyph = (k, cls = "") => `<svg viewBox="0 0 24 24" class="${cls}" aria-hidden="true">${GLYPHS[k]}</svg>`;
const ARROW_OUT = `<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 L9 3 M4 3 H9 V8"/></svg>`;
const ARROW_RIGHT = `<svg viewBox="0 0 14 8" aria-hidden="true"><path d="M0 4 H13 M10 1 L13 4 L10 7"/></svg>`;

/* Logo stylesheet, written once */
document.head.insertAdjacentHTML("beforeend", `<style>${Object.entries(LOGOS).map(([k, l]) => `.logo--${k}{--src:url("${l.src}")}`).join("")}</style>`);
const logo = (key, base = 16) => {
  const l = LOGOS[key]; if (!l) return "";
  const ar = l.w / l.h;
  const h = base * Math.min(1.9, Math.max(.72, Math.sqrt(3.4 / ar)));
  return `<span class="logo logo--${key}" role="img" aria-label="${l.name}" style="height:${h.toFixed(1)}px;width:${(h * ar).toFixed(1)}px"></span>`;
};

const icon = name => `<div class="object"><svg class="icon" viewBox="0 0 64 64" aria-hidden="true">${(ICONS[name] || ICONS.seal)()}</svg><div class="plinth"></div></div>`;

const upright = a => `
  <article class="cell award">
    <div class="award-top">
      <p class="date">${a.date}</p>
      ${a.rank ? `<span class="medal" aria-hidden="true">${a.rank}</span>` : ""}
    </div>
    ${icon(a.icon)}
    <h2>${a.title}</h2>
    <p class="prize">${a.prize}</p>
    <p class="sponsor-line"><span>${a.sponsorLine[0]}</span>${a.sponsorLine.slice(1).map(k => logo(k, 13)).join("")}</p>
    <p class="event">${a.event}</p>
    <button class="more" data-open="${a.id}" aria-haspopup="dialog" aria-label="View details for ${a.title}">View details ${ARROW_RIGHT}</button>
  </article>`;

const wide = a => `
  <article class="cell wide">
    ${icon(a.icon)}
    <div class="text">
      <p class="eyebrow">${a.kind}</p>
      <h2>${a.title}</h2>
      <p class="detail">${a.detail}</p>
    </div>
  </article>`;

const count = r => HACKATHONS.filter(a => a.rank === r).length;
const teams = HACKATHONS.reduce((s, a) => s + (a.teams || 0), 0);
const record = `
  <article class="cell record">
    <p class="eyebrow">Record</p>
    <div class="stats">
      <div class="stat"><span class="stat-value">${count("I")}</span><span class="stat-label">First Prizes</span></div>
      <div class="stat"><span class="stat-value">${count("II")}</span><span class="stat-label">Second Prize${count("II") === 1 ? "" : "s"}</span></div>
      <div class="stat"><span class="stat-value">${HACKATHONS.length}</span><span class="stat-label">Hackathons Won</span></div>
      <div class="stat"><span class="stat-value">${teams}+</span><span class="stat-label">Teams in the Field</span></div>

const ledge = label => `<div class="ledge"><span class="shelf-label">${label}</span></div>`;

document.getElementById("grid").innerHTML =
  HACKATHONS.map(upright).join("") + ledge("Hackathon Victories") +
  HONORS.map(wide).join("") + record + ledge("Leadership & Honors");

/* Detail card */
const dialog = document.getElementById("detail");
const tabsEl = document.getElementById("d-tabs");
const panelEl = document.getElementById("d-panel");
const LANG_TONES = ["var(--gold)", "var(--gold-soft)", "#B9B6AE", "var(--stone-2)"];
let current = null;

const TABS = [
  { id: "demo", label: "Demo", sub: a => a.demos.length ? a.demos.map(d => d.title.replace("Demo ", "")).join(" · ").replace(/^v/, "V") : "Not hosted" },
  { id: "github", label: "GitHub", sub: a => `${a.repo.owner}/${a.repo.name}` },
  { id: "event", label: "Event", sub: a => `${a.meet.name}` },
  { id: "summary", label: "Summary", sub: () => "Role & outcome" },
];

const PANELS = {
  demo: a => a.demos.length ? `
    <div class="panel-head"><div><p class="eyebrow">See it working</p><h3>${a.title} demo</h3></div></div>
    <div class="cards">
      ${a.demos.map(d => `
        <a class="card" href="${d.url}" target="_blank" rel="noopener">
          ${glyph(d.kind)}
          <span><span class="card-title">${d.title}</span><span class="card-host">${d.host}</span></span>
          <svg class="arrow" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 9 L9 3 M4 3 H9 V8"/></svg>
        </a>`).join("")}
    </div>` : `
    <div class="panel-head"><div><p class="eyebrow">See it working</p><h3>${a.title} demo</h3></div></div>
    <p class="empty">There is no hosted demo for ${a.title}. The full build and the team’s write-up are in the GitHub repository.</p>
    <button class="btn" data-tab="github">Go to GitHub ${ARROW_RIGHT}</button>`,

  github: a => {
    const total = Object.values(a.repo.langs).reduce((s, v) => s + v, 0);
    const langs = Object.entries(a.repo.langs).map(([n, v], i) => ({ n, p: v / total * 100, c: LANG_TONES[i] || LANG_TONES[3] }));
    const url = `https://github.com/${a.repo.owner}/${a.repo.name}`;
    return `
      <div class="panel-head">
        <div><p class="eyebrow">Source code</p><h3 class="repo-path"><span>${a.repo.owner} /</span> ${a.repo.name}</h3></div>
        <a class="btn" href="${url}" target="_blank" rel="noopener">Open on GitHub ${ARROW_OUT}</a>
      </div>
      <p class="repo-note">${a.pitch}</p>
      <div class="langbar" aria-hidden="true">${langs.map(l => `<i style="width:${l.p}%;background:${l.c}"></i>`).join("")}</div>
      <ul class="langs">${langs.map(l => `<li><i style="background:${l.c}"></i><b>${l.n}</b> ${l.p < 1 ? "<1" : l.p.toFixed(1)}%</li>`).join("")}</ul>`;
  },

  event: a => {
    const m = a.meet;
    return `
      <div class="panel-head">
        <div><p class="eyebrow">${m.series}</p><h3>${m.name}</h3>
          <p class="event-meta">${m.when} · ${m.where}</p>
          <p class="event-meta">${m.format}.</p></div>
        <a class="btn" href="${m.url}" target="_blank" rel="noopener">View on Luma ${ARROW_OUT}</a>
      </div>
      ${m.groups.map(([title, keys]) => `
        <div class="wall-group">
          <p class="wall-title">${title}</p>
          <ul class="wall">${keys.map(k => `<li class="${m.prizeSponsors.includes(k) ? "is-prize" : ""}">${logo(k, 17)}</li>`).join("")}</ul>
        </div>`).join("")}
      <p class="wall-key">Marked in gold: the sponsor${m.prizeSponsors.length > 1 ? "s" : ""} named in this award</p>`;
  },

  summary: a => `
    <div class="summary">
      <div>
        <p class="eyebrow" style="font-size:10px;letter-spacing:.3em;color:var(--gold)">My role</p>
        <p class="lead">${a.role}</p>
        <p class="outcome">${a.outcome}</p>
      </div>
      <dl class="facts">${a.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </div>`,
};

function selectTab(id, focusPanel) {
  tabsEl.querySelectorAll(".tab").forEach(t => {
    const on = t.dataset.tab === id;
    t.setAttribute("aria-selected", on);
    t.tabIndex = on ? 0 : -1;
  });
  panelEl.setAttribute("aria-labelledby", `tab-${id}`);
  panelEl.innerHTML = PANELS[id](current);
  if (focusPanel) panelEl.focus({ preventScroll: true });
}

function openDetail(id, tab) {
  current = HACKATHONS.find(a => a.id === id);
  if (!current) return;
  const a = current;
  document.getElementById("d-object").innerHTML = `<svg class="icon" viewBox="0 0 64 64" aria-hidden="true">${ICONS[a.icon]()}</svg><div class="plinth"></div>`;
  document.getElementById("d-prize").textContent = `${a.prize}${a.id === "donna" ? " · Best Legal Track" : ""}`;
  document.getElementById("d-date").textContent = a.facts.find(f => f[0] === "Date")[1];
  document.getElementById("d-title").textContent = a.title;
  document.getElementById("d-pitch").textContent = a.pitch;
  tabsEl.innerHTML = TABS.map(t => `
    <button class="tab${t.id === "demo" && !a.demos.length ? " is-empty" : ""}" role="tab" id="tab-${t.id}" data-tab="${t.id}" aria-controls="d-panel">
      ${glyph(t.id)}<span class="tab-label">${t.label}</span><span class="tab-sub">${t.sub(a)}</span>
    </button>`).join("");
  selectTab(tab || (a.demos.length ? "demo" : "summary"));
  if (!dialog.open) dialog.showModal();
  tabsEl.querySelector('[aria-selected="true"]').focus();
}

document.addEventListener("click", e => {
  const opener = e.target.closest("[data-open]");
  if (opener) return openDetail(opener.dataset.open);
  const tab = e.target.closest("[data-tab]");
  if (tab && dialog.contains(tab)) {
    selectTab(tab.dataset.tab, !tab.classList.contains("tab"));
    if (!tab.classList.contains("tab")) tabsEl.querySelector(`[data-tab="${tab.dataset.tab}"]`).focus();
  }
});
tabsEl.addEventListener("keydown", e => {
  const tabs = [...tabsEl.querySelectorAll(".tab")];
  const i = tabs.indexOf(document.activeElement);
  if (i < 0 || !["ArrowRight", "ArrowLeft", "Home", "End"].includes(e.key)) return;
  e.preventDefault();
  const n = e.key === "Home" ? 0 : e.key === "End" ? tabs.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + tabs.length) % tabs.length;
  tabs[n].focus(); selectTab(tabs[n].dataset.tab);
});
document.getElementById("d-close").addEventListener("click", () => dialog.close());
dialog.addEventListener("click", e => { if (e.target === dialog) dialog.close(); });

/* Deep link: #emily, #missed, #donna or #medi opens that award */
if (location.hash) openDetail(location.hash.slice(1));
</script>
